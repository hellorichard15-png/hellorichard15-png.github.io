<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>冰箱库存小管家</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f5f7fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* 容器样式（模拟手机/小程序界面） */
        .app-container {
            width: 100%;
            max-width: 414px;
            height: 100vh;
            max-height: 736px;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* 页面通用类 */
        .page {
            display: none;
            width: 100%;
            height: 100%;
            padding: 20px;
            flex-direction: column;
        }

        .page.active {
            display: flex;
        }

        /* --- 1. 登录页面样式 --- */
        #login-page {
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #e0f2fe 0%, #ffffff 100%);
        }

        .login-card {
            width: 100%;
            background: white;
            padding: 30px 20px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            text-align: center;
        }

        .login-card h2 {
            margin-bottom: 20px;
            color: #0284c7;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            outline: none;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 10px;
            transition: opacity 0.2s;
        }

        .btn:active {
            opacity: 0.8;
        }

        .btn-primary { background-color: #0284c7; color: white; }
        .btn-secondary { background-color: #e2e8f0; color: #475569; }
        .btn-guest { background-color: transparent; color: #64748b; border: 1px dashed #cbd5e1; }

        /* --- 2. 主页样式 --- */
        #home-page {
            position: relative;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 15px;
            border-bottom: 1px solid #f1f5f9;
        }

        .inventory-list {
            flex: 1;
            overflow-y: auto;
            margin-top: 15px;
            padding-bottom: 80px;
        }

        .item-card {
            background: #f8fafc;
            border-left: 5px solid #0284c7;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }

        .item-info .type {
            font-size: 12px;
            color: #0284c7;
            background: #e0f2fe;
            padding: 2px 6px;
            border-radius: 4px;
            display: inline-block;
            margin-bottom: 4px;
        }

        .item-info .name {
            font-size: 16px;
            font-weight: bold;
            color: #334155;
        }

        .item-qty {
            font-size: 18px;
            font-weight: bold;
            color: #0f172a;
        }

        /* 浮动加号按钮 */
        .fab-btn {
            position: absolute;
            bottom: 25px;
            right: 25px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background-color: #0284c7;
            color: white;
            font-size: 32px;
            border: none;
            box-shadow: 0 4px 10px rgba(2, 132, 199, 0.4);
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- 3. 弹窗样式 --- */
        .modal-overlay {
            display: none;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 100;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: white;
            width: 100%;
            border-radius: 12px;
            padding: 20px;
        }

        .modal h3 {
            margin-bottom: 15px;
            color: #1e293b;
        }

        .modal select, .modal input {
            width: 100%;
            padding: 10px;
            margin-bottom: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="app-container">
    <div id="login-page" class="page active">
        <div class="login-card">
            <h2>❄️ 冰箱库存小管家</h2>
            <div class="input-group">
                <input type="text" id="username" placeholder="用户名/账号">
            </div>
            <div class="input-group">
                <input type="password" id="password" placeholder="密码">
            </div>
            <button class="btn btn-primary" onclick="handleAuth('登录')">登录账号</button>
            <button class="btn btn-secondary" onclick="handleAuth('注册')">注册账号</button>
            <button class="btn btn-guest" onclick="loginAsGuest()">游客登录</button>
        </div>
    </div>

    <div id="home-page" class="page">
        <div class="header">
            <h3>我的冰箱库存</h3>
            <span id="user-display" style="font-size: 12px; color: #64748b;"></span>
        </div>

        <div class="inventory-list" id="inventory-list">
            </div>

        <button class="fab-btn" onclick="openModal()">+</button>
    </div>

    <div class="modal-overlay" id="add-modal">
        <div class="modal">
            <h3>添加冰箱物品</h3>
            <label style="font-size: 12px; color: #64748b;">物品类型</label>
            <select id="item-type">
                <option value="🥦 蔬菜水果">🥦 蔬菜水果</option>
                <option value="🥩 肉类海鲜">🥩 肉类海鲜</option>
                <option value="🥛 饮品乳品">🥛 饮品乳品</option>
                <option value="🥫 调料零食">🥫 调料零食</option>
                <option value="📦 其他物品">📦 其他物品</option>
            </select>

            <label style="font-size: 12px; color: #64748b;">物品名称</label>
            <input type="text" id="item-name" placeholder="例如：牛奶 / 苹果">

            <label style="font-size: 12px; color: #64748b;">物品数量</label>
            <input type="text" id="item-qty" placeholder="例如：2盒 / 1kg">

            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeModal()">取消</button>
                <button class="btn btn-primary" onclick="addItem()">保存</button>
            </div>
        </div>
    </div>
</div>

<script>
    // 模拟数据存储
    let items = JSON.parse(localStorage.getItem('fridge_items')) || [];

    // 页面切换
    function showPage(pageId) {
        document.querySelectorAll('.page').forEach(page => page.classList.remove('active'));
        document.getElementById(pageId).classList.add('active');
    }

    // 登录 / 注册处理
    function handleAuth(type) {
        const user = document.getElementById('username').value.trim();
        if (!user) {
            alert('请输入用户名！');
            return;
        }
        document.getElementById('user-display').innerText = `用户: ${user}`;
        showPage('home-page');
        renderItems();
    }

    // 游客登录
    function loginAsGuest() {
        document.getElementById('user-display').innerText = '当前：游客模式';
        showPage('home-page');
        renderItems();
    }

    // 弹窗控制
    function openModal() {
        document.getElementById('add-modal').classList.add('active');
    }

    function closeModal() {
        document.getElementById('add-modal').classList.remove('active');
        // 清空输入框
        document.getElementById('item-name').value = '';
        document.getElementById('item-qty').value = '';
    }

    // 添加物品
    function addItem() {
        const type = document.getElementById('item-type').value;
        const name = document.getElementById('item-name').value.trim();
        const qty = document.getElementById('item-qty').value.trim();

        if (!name || !qty) {
            alert('请完整填写物品名称和数量！');
            return;
        }

        const newItem = { id: Date.now(), type, name, qty };
        items.push(newItem);
        
        // 保存到 LocalStorage
        localStorage.setItem('fridge_items', JSON.stringify(items));

        renderItems();
        closeModal();
    }

    // 删除物品
    function deleteItem(id) {
        items = items.filter(item => item.id !== id);
        localStorage.setItem('fridge_items', JSON.stringify(items));
        renderItems();
    }

    // 渲染卡片列表
    function renderItems() {
        const listContainer = document.getElementById('inventory-list');
        listContainer.innerHTML = '';

        if (items.length === 0) {
            listContainer.innerHTML = '<p style="text-align:center; color:#94a3b8; margin-top:40px;">冰箱空空如也，点击右下角添加吧！</p>';
            return;
        }

        items.forEach(item => {
            const card = document.createElement('div');
            card.className = 'item-card';
            card.innerHTML = `
                <div class="item-info">
                    <span class="type">${item.type}</span>
                    <div class="name">${item.name}</div>
                </div>
                <div style="display: flex; align-items: center; gap: 10px;">
                    <span class="item-qty">${item.qty}</span>
                    <button onclick="deleteItem(${item.id})" style="border:none; background:none; color:#ef4444; cursor:pointer; font-size: 12px;">删除</button>
                </div>
            `;
            listContainer.appendChild(card);
        });
    }
</script>

</body>
</html>
