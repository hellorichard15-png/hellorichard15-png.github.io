  body { background: #fafafa; color: #222831; }
  nav { background: #222831; position: sticky; top: 0; z-index: 99; }
  .nav-wrap { max-width: 1000px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; height: 60px; }
  .logo { color: #fff; font-size: 20px; font-weight: 700; letter-spacing: 1px; }
  .nav-links { display: flex; flex-wrap: wrap; }
  .nav-links a { color: #cfd3d8; text-decoration: none; margin-left: 22px; font-size: 15px; padding: 4px 2px; transition: color .2s; }
  .nav-links a:hover { color: #fff; }
  .nav-links a.active { color: #00adb5; border-bottom: 2px solid #00adb5; }
  main { max-width: 1000px; margin: 60px auto; padding: 0 20px; }
  .hero { text-align: center; padding: 40px 0; }
  .avatar { width: 160px; height: 160px; border-radius: 50%; background: #393e46; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 26px; margin: 0 auto 28px; border: 4px solid #00adb5; }
  .hero h1 { font-size: 34px; margin-bottom: 14px; }
  .hero p { font-size: 17px; color: #555; line-height: 1.8; max-width: 640px; margin: 0 auto; }
  .quick { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; margin-top: 56px; }
  .quick a { background: #fff; border: 1px solid #ececec; border-radius: 12px; padding: 22px; text-decoration: none; color: #222831; transition: transform .15s, box-shadow .15s; }
  .quick a:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(0,0,0,.06); }
  .quick h3 { color: #00adb5; margin-bottom: 8px; font-size: 17px; }
  .quick p { font-size: 14px; color: #666; line-height: 1.6; }
  footer { text-align: center; color: #999; font-size: 13px; padding: 30px 0; margin-top: 40px; }
  @media (max-width: 640px) { .quick { grid-template-columns: 1fr; } .nav-links a { margin-left: 14px; font-size: 14px; } }
</style>
</head>
